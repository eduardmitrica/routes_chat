name: Tests

on:
  pull_request:
    branches: [main]

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Pinned to the version the project is developed against, so generated
      # code (freezed / json_serializable output is committed) and analyzer
      # behaviour match local runs.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # lib/firebase_options.dart is git-ignored (generated by `flutterfire
      # configure`), so the analyzer can't resolve main.dart without it. A
      # placeholder with the members the app uses is enough: tests never
      # initialize Firebase.
      - name: Write placeholder Firebase options
        run: |
          [ -f lib/firebase_options.dart ] || cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => ios;

            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: 'ci-placeholder',
              appId: 'ci-placeholder',
              messagingSenderId: 'ci-placeholder',
              projectId: 'ci-placeholder',
              iosClientId: 'ci-placeholder',
            );
          }
          EOF

      # Fails on errors and warnings, and on infos too (Flutter's default), so
      # lints stay at zero the way they are locally.
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  functions:
    name: functions test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Matches the deployed runtime (firebase.json: nodejs22).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
