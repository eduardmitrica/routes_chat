name: Tests

on:
  pull_request:
    branches: [main]

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Pinned to the version the project is developed against, so generated
      # code (freezed / json_serializable output is committed) and analyzer
      # behaviour match local runs.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Fails on errors and warnings, and on infos too (Flutter's default), so
      # lints stay at zero the way they are locally.
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
